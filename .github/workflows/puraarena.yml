name: Build PuraArena
on:
  pull_request:
    paths: ['PuraArena/**', '.github/workflows/puraarena.yml']
  push:
    paths: ['PuraArena/**', '.github/workflows/puraarena.yml']
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle -p PuraArena build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PuraArena-1.0.0
          path: PuraArena/build/libs/PuraArena-1.0.0.jar
          if-no-files-found: error
