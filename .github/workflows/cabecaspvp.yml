name: Build CabecasPvP

on:
  push:
    branches: [cabecaspvp-rebuild]
    paths:
      - 'CabecasPvP/**'
      - '.github/workflows/cabecaspvp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: gradle -p CabecasPvP clean build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CabecasPvP-1.0.1
          path: CabecasPvP/build/libs/CabecasPvP-1.0.1.jar
          if-no-files-found: error
